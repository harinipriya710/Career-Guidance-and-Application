<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerPath</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
</head>
<body>

<!-- Loading Spinner -->
<div id="loadingSpinner" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#c38d67] mx-auto"></div>
        <p class="mt-2 text-gray-700">Signing in...</p>
    </div>
</div>

<section class="bg-gradient-to-r from-blue-50 via-blue-100 to-blue-200 min-h-screen flex items-center justify-center p-4 relative">
    
    <!-- Back to Home Button -->
    <a onclick="router.navigateTo('home')" class="absolute top-6 left-6 flex items-center gap-2 bg-white px-4 py-2 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 text-[#3352B7] font-semibold group">
        <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
        <span>Back to Home</span>
    </a>

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-[#3352B7] mb-6 text-center">Login to CareerPath</h2>
        
        <!-- Success/Error Messages -->
        <div id="messageDiv" class="hidden mb-4 p-3 rounded-md"></div>
        
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="loginEmail">Email</label>
                <input 
                    type="email" 
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#c38d67] transition-colors" 
                    required>
            </div>

            <div class="mb-4 relative">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="loginPassword">Password</label>
                <input 
                    type="password" 
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#c38d67] transition-colors pr-10" 
                    required>
                <button
                    type="button"
                    id="toggleLoginPassword"
                    class="absolute right-3 top-9 text-gray-600 hover:text-gray-800"
                >
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="mb-6 flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" id="rememberMe" class="mr-2 rounded">
                    <span class="text-sm text-gray-600">Remember me</span>
                </label>
                <a href="#" class="text-sm text-[#3352B7] hover:underline">Forgot Password?</a>
            </div>
            
            <button 
                type="submit" 
                id="loginBtn"
                class="w-full bg-[#3352B7] text-white py-3 px-4 rounded-md hover:bg-[#0266FF] transition-colors font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
                Sign In
            </button>
        </form>
        
        <!-- Divider -->
        <div class="my-6 flex items-center">
            <div class="flex-1 border-t border-gray-300"></div>
            <span class="px-4 text-gray-500 text-sm">OR</span>
            <div class="flex-1 border-t border-gray-300"></div>
        </div>
        
        <!-- Register Link -->
        <div class="text-center">
            <p class="text-gray-600">Don't have an account? 
                <a href="#" onclick="event.preventDefault();router.navigateTo('register')" class="text-[#3352B7] hover:underline font-semibold cursor-pointer">Create Account</a>
            </p>
        </div>
    </div>
</section>

</body>
</html>
