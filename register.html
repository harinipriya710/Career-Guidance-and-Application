<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - CareerPath</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-50 via-blue-100 to-blue-200 ">
   <a href="index.html" class="absolute top-6 left-6 flex items-center gap-2 bg-white px-4 py-2 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 text-[#3352B7] font-semibold group">
        <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
        <span>Back to Home</span>
    </a>

  <!-- Loading Spinner -->
  <div id="loadingSpinner" style="display:none;" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-200 border-t-blue-800 mx-auto"></div>
      <p class="mt-4 text-gray-700 font-medium">Creating account...</p>
    </div>
  </div>

  <!-- Centered Container -->
  <div class="w-full max-w-md mx-auto pt-40 bg-[#FFFFFF]">
    <div class="bg-white p-6 rounded-2xl shadow-2xl w-full border-2 border-blue-100">
      <h2 class="text-2xl font-bold text-blue-800 mb-4 text-center">Register for CareerPath</h2>
      
      <div id="messageDiv" style="display:none;" class="mb-3 p-3 rounded-md text-sm font-medium"></div>

      <form id="registerForm" class="space-y-4">
        <!-- Full Name -->
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2" for="fullName">Full Name <span class="text-red-500">*</span></label>
          <input type="text" id="fullName" placeholder="Enter your full name" class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email <span class="text-red-500">*</span></label>
          <input type="email" id="email" placeholder="example@email.com" class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required />
        </div>

        <!-- Password -->
        <div class="relative">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password <span class="text-red-500">*</span></label>
          <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 pr-12" />
          <button type="button" id="togglePassword" class="absolute right-4 top-[42px] text-gray-500 hover:text-gray-700 focus:outline-none">
            <i class="fas fa-eye-slash text-lg"></i>
          </button>
        </div>



        <button type="submit" id="registerBtn" class="w-full bg-blue-800 text-white py-2.5 rounded-xl font-bold hover:bg-blue-700 transition-all duration-200 disabled:opacity-50 mt-2">
          Create Account
        </button>
      </form>

      <div class="mt-4 text-center">
        <p class="text-sm text-gray-600">Already have an account? <a href="#"  onclick="event.preventDefault(); router.navigateTo('login')" class="text-blue-800 hover:underline font-bold cursor-pointer">Log In</a></p>
      </div>
    </div>
  </div>

  
</body>
</html>
