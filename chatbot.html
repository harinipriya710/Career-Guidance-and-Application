<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot - CareerPath</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen  bg-gradient-to-r from-blue-50 via-blue-100 to-blue-200 flex items-center justify-center p-4 pt-7">
    <!-- Chat Section -->
    <section class="w-full max-w-2xl bg-white rounded-2xl shadow-lg flex flex-col h-[80vh] border border-blue-100">
      <!-- Header -->
      <div class="p-4 border-b bg-[#3352B7] text-white rounded-t-2xl">
        <h2 class="text-xl font-bold">CareerPath Chatbot</h2>
      </div>
      <!-- Chat messages -->
      <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3">
        <div class="text-gray-500 text-sm text-center">
          Hello! I'm your CareerPath Assistant. Ask me about careers, colleges, or courses!
        </div>
      </div>
      <!-- Input -->
      <div class="p-4 border-t flex space-x-2">
        <input
          id="userInput"
          type="text"
          placeholder="Ask me about careers..."
          class="flex-1 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
          id="sendBtn"
          class="bg-[#3352B7] text-white px-4 py-2 rounded-md hover:bg-[#2c469a] transition"
        >
          Send
        </button>
      </div>
    </section>
    <script>
      
      const API_KEY = "AIzaSyAqjONaglMEzOdAzO9K7BRIdVUjh8nbaSY";
const userInput = document.getElementById("userInput");
const chatBox = document.getElementById("chatBox");
const sendBtn = document.getElementById("sendBtn");
// Send message to Gemini
async function sendMessage() {
  const message = userInput.value.trim();
  if (!message) return;
  // Add user message
  chatBox.innerHTML += `
    <div class="text-right">
      <div class="inline-block bg-[#F0F9FF] text-blue-900 px-3 py-2 rounded-lg">${message}</div>
    </div>
  `;
  userInput.value = "";
  // Scroll down
  chatBox.scrollTop = chatBox.scrollHeight;
  // Typing indicator
  chatBox.innerHTML += `<div id="typing" class="text-gray-400 italic text-sm">Assistant is typing...</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: message }]
          }]
        }),
      }
    );
    const data = await response.json();
    document.getElementById("typing")?.remove();
    if (!response.ok) {
      throw new Error(data.error?.message || `API Error: ${response.status}`);
    }
    const reply =
      data?.candidates?.[0]?.content?.parts?.[0]?.text ||
      "⚠️ Sorry, I couldn't generate a response.";
    // Add bot reply
    chatBox.innerHTML += `
      <div class="text-left">
        <div class="inline-block bg-gray-200 text-gray-800 px-3 py-2 rounded-lg whitespace-pre-wrap">
          ${reply}
        </div>
      </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch (error) {
    document.getElementById("typing")?.remove();
    chatBox.innerHTML += `
      <div class="text-left text-red-500">
        ⚠️ Error: ${error.message}
      </div>
    `;
    console.error("API Error:", error);
  }
}
// Button click and Enter key
sendBtn.addEventListener("click", sendMessage);
userInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendMessage();
});
    </script>
  </body>
</html>
