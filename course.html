    // State
    let selectedCareer = null, selectedSubcategory = null, selectedLevel='beginner';

    function renderBreadcrumb() {
      const breadcrumb = document.getElementById('breadcrumb');
      let html = `<button onclick="showCareers()" class="hover:text-blue-600">All Careers</button>`;
      if(selectedCareer) {
        html += ` <span>></span> `;
        if(careers[selectedCareer].hasSubcategories && !selectedSubcategory) {
          html += `<span class="text-gray-900">${careers[selectedCareer].title}</span>`;
        } else {
          html += `<button onclick="showSubcategories('${selectedCareer}')" class="hover:text-blue-600">${careers[selectedCareer].title}</button>`;
        }
      }
      if(selectedSubcategory) {
        html += ` <span>></span> <span class="text-gray-900">${careers[selectedCareer].subcategories[selectedSubcategory].title}</span>`;
      }
      breadcrumb.innerHTML = html;
    }

    function renderCareerCards() {
      const container=document.getElementById('career-cards');
      container.innerHTML='';
      Object.entries(careers).forEach(([key,career])=>{
        const card=document.createElement('div');
        card.className='career-card cursor-pointer rounded-xl p-6 bg-white shadow-sm hover:shadow-md';
        card.onclick=()=>selectCareer(key);
        card.innerHTML=`
          <div class="${career.color} w-12 h-12 rounded-lg flex items-center justify-center mb-4">
            <i data-lucide="${career.icon}" class="w-6 h-6 text-white"></i>
          </div>
          <h3 class="text-xl font-semibold text-gray-900 mb-2">${career.title}</h3>
          <p class="text-gray-600 text-sm mb-4">${career.description}</p>
          <div class="space-y-2 text-sm text-gray-500">
            <div class="flex items-center"><i data-lucide="briefcase" class="w-4 h-4 mr-2"></i>${career.averageSalary}</div>
            <div class="flex items-center"><i data-lucide="trending-up" class="w-4 h-4 mr-2"></i>${career.jobGrowth}</div>
          </div>
          ${career.hasSubcategories?'<div class="mt-4 text-sm text-blue-600 font-medium">View Specializations →</div>':""}
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function selectCareer(key){
      selectedCareer=key;
      if(careers[key].hasSubcategories){ showSubcategories(key); }
      else { selectedSubcategory=null; showRoadmap(); }
    }
    function showCareers(){
      selectedCareer=null; selectedSubcategory=null;
      document.getElementById('career-cards').style.display='grid';
      document.getElementById('subcategory-section').style.display='none';
      document.getElementById('career-details').style.display='none';
      renderBreadcrumb(); renderCareerCards();
    }
    function showSubcategories(key){
      selectedCareer=key; selectedSubcategory=null;
      document.getElementById('career-cards').style.display='none';
      document.getElementById('subcategory-section').style.display='block';
      document.getElementById('career-details').style.display='none';
      document.getElementById('subcategory-title').textContent=`Choose your ${careers[key].title} specialization`;
      const container=document.getElementById('subcategory-cards');
      container.innerHTML='';
      Object.entries(careers[key].subcategories).forEach(([skey,sub])=>{
        const card=document.createElement('div');
        card.className='subcategory-card cursor-pointer rounded-lg p-4 bg-white border hover:border-blue-300';
        card.onclick=()=>selectSubcategory(skey);
        card.innerHTML=`
          <h4 class="text-lg font-semibold text-gray-900 mb-2">${sub.title}</h4>
          <p class="text-gray-600 text-sm mb-3">${sub.description}</p>
          <div class="text-sm text-gray-500 space-y-1">
            <div class="flex items-center"><i data-lucide="briefcase" class="w-4 h-4 mr-2"></i>${sub.averageSalary}</div>
            <div class="flex items-center"><i data-lucide="trending-up" class="w-4 h-4 mr-2"></i>${sub.jobGrowth}</div>
          </div>`;
        container.appendChild(card);
      });
      renderBreadcrumb(); lucide.createIcons();
    }
    function selectSubcategory(k){ selectedSubcategory=k; showRoadmap(); }
    function showRoadmap(){
      document.getElementById('career-cards').style.display='none';
      document.getElementById('subcategory-section').style.display='none';
      document.getElementById('career-details').style.display='block';
      renderCareerDetails(); renderBreadcrumb();
    }
    function selectLevel(l){ selectedLevel=l; renderRoadmap(); }
    function getCurrentCareerData(){ return selectedSubcategory?careers[selectedCareer].subcategories[selectedSubcategory]:careers[selectedCareer]; }

    function renderCareerDetails(){
      const current=getCurrentCareerData();
      const details=document.getElementById('career-details');
      details.innerHTML=`
        <div class="flex items-center mb-6">
          <div class="${careers[selectedCareer].color} w-16 h-16 rounded-xl flex items-center justify-center mr-6">
            <i data-lucide="${careers[selectedCareer].icon}" class="w-8 h-8 text-white"></i>
          </div>
          <div>
            <h2 class="text-3xl font-bold text-gray-900">${current.title}</h2>
            <p class="text-gray-600">${current.description}</p>
            <div class="mt-2 text-sm text-gray-500 flex space-x-4">
              <span><i data-lucide="briefcase" class="w-4 h-4 mr-1"></i>${current.averageSalary||''}</span>
              <span><i data-lucide="trending-up" class="w-4 h-4 mr-1"></i>${current.jobGrowth||''}</span>
            </div>
          </div>
        </div>

        ${current.content ? `
        <div class="mb-6">
          <h3 class="text-xl font-semibold text-gray-900 mb-2">Overview</h3>
          <p class="text-gray-600 mb-4">${current.content.overview}</p>

          <h3 class="text-xl font-semibold text-gray-900 mb-2">Key Skills</h3>
          <ul class="list-disc list-inside text-gray-600 mb-4">
            ${current.content.skills.map(s=>`<li>${s}</li>`).join('')}
          </ul>

          <h3 class="text-xl font-semibold text-gray-900 mb-2">Career Options</h3>
          <ul class="list-disc list-inside text-gray-600 mb-4">
            ${current.content.careerOptions.map(c=>`<li>${c}</li>`).join('')}
          </ul>

          <h3 class="text-xl font-semibold text-gray-900 mb-2">Top Recruiters</h3>
          <ul class="list-disc list-inside text-gray-600 mb-4">
            ${current.content.topRecruiters.map(r=>`<li>${r}</li>`).join('')}
          </ul>

          <h3 class="text-xl font-semibold text-gray-900 mb-2">Higher Studies</h3>
          <ul class="list-disc list-inside text-gray-600 mb-4">
            ${current.content.higherStudies.map(h=>`<li>${h}</li>`).join('')}
          </ul>
        </div>` : ''}

        <div class="flex space-x-4 mb-6">
          <button onclick="selectLevel('beginner')" class="px-4 py-2 rounded-lg text-sm font-medium ${selectedLevel==='beginner'?'bg-blue-600 text-white':'bg-gray-100 text-gray-600'}">Beginner</button>
          <button onclick="selectLevel('intermediate')" class="px-4 py-2 rounded-lg text-sm font-medium ${selectedLevel==='intermediate'?'bg-blue-600 text-white':'bg-gray-100 text-gray-600'}">Intermediate</button>
          <button onclick="selectLevel('advanced')" class="px-4 py-2 rounded-lg text-sm font-medium ${selectedLevel==='advanced'?'bg-blue-600 text-white':'bg-gray-100 text-gray-600'}">Advanced</button>
        </div>
        <div id="roadmap-timeline"></div>`;
      renderRoadmap(); lucide.createIcons();
    }

    function renderRoadmap(){
      const current=getCurrentCareerData();
      const steps=current.roadmap && current.roadmap[selectedLevel]?current.roadmap[selectedLevel]:[];
      const container=document.getElementById('roadmap-timeline');
      if(!steps.length){ container.innerHTML='<p class="text-gray-500">Roadmap not yet defined for this specialization.</p>'; return;}
      container.innerHTML=`<div class="roadmap-timeline">${steps.map(s=>`
        <div class="timeline-item pl-8">
          <h4 class="text-lg font-semibold text-gray-900">${s.title}</h4>
          <p class="text-sm text-gray-500 mb-2">${s.duration}</p>
          <div class="flex flex-wrap gap-2">
            ${s.skills.map(skill=>`<span class="skill-tag bg-blue-50 text-blue-700 text-xs px-3 py-1 rounded-full">${skill}</span>`).join('')}
          </div>
        </div>`).join('')}</div>`;
    }

    // Initial
    renderCareerCards(); renderBreadcrumb();
  </script>
</body>
</html>
